<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- Jar body -->
  <rect x="172" y="210" width="168" height="160" rx="16" fill="white"/>
  <!-- Jar neck -->
  <rect x="196" y="172" width="120" height="44" rx="8" fill="white"/>
  <!-- Jar lid -->
  <rect x="180" y="152" width="152" height="28" rx="10" fill="white" opacity="0.85"/>
  <!-- Horizontal lines inside jar (food layers) -->
  <line x1="188" y1="260" x2="324" y2="260" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  <line x1="188" y1="300" x2="324" y2="300" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  <line x1="188" y1="340" x2="324" y2="340" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  <!-- Calendar badge -->
  <rect x="300" y="310" width="96" height="84" rx="16" fill="#e67e22"/>
  <rect x="300" y="310" width="96" height="26" rx="8" fill="#d35400"/>
  <rect x="300" y="328" width="96" height="8" fill="#d35400"/>
  <text x="348" y="380" font-size="40" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">!</text>
</svg>
